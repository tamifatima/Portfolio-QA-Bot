<!DOCTYPE html>
<!--
=============================================================
  index.html  —  HTML Shell
=============================================================

PURPOSE:
  Vite serves this file as the root HTML page.
  It's intentionally minimal — React takes over the <div id="root">.

  The <script type="module"> tag loads main.jsx.
  Vite processes this during dev (with HMR) and bundles it for prod.
=============================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahreem's Portfolio Bot</title>
  </head>
  <body>
    <!-- React mounts into this div (see main.jsx) -->
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
